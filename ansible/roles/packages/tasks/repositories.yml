---
- name: Remove legacy GitHub CLI apt list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent
  become: true

- name: Add GitHub CLI apt repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present
  become: true

- name: Add NodeSource repository for Node.js 22
  ansible.builtin.shell:
    cmd: curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    creates: /etc/apt/sources.list.d/nodesource.list
  become: true
