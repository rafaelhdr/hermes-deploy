---
- name: Prepare inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Read terraform outputs
      ansible.builtin.command: terraform output -json
      args:
        chdir: ../terraform
      register: tf_output
      changed_when: false

    - name: Add grocery host dynamically
      ansible.builtin.add_host:
        name: grocery
        ansible_host: "{{ zerotier_ip }}"
        ansible_user: "{{ tf_user }}"
        groups: hermes
      vars:
        tf_user: >-
          {{ (tf_output.stdout | from_json).ssh_connection.value
             | regex_replace('^ssh ([^@]+)@.*', '\1') }}

- name: Configure Hermes Grocery application
  hosts: hermes
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/secrets.yml

  tasks:
    - name: Set up package repositories and install system packages
      ansible.builtin.import_role:
        name: packages

    - name: Check gh auth status
      ansible.builtin.command: gh auth status
      register: gh_auth_status
      changed_when: false
      failed_when: false
      become: true
      become_user: hermes
      environment:
        HOME: /home/hermes

    - name: Deploy GitHub App private key
      ansible.builtin.copy:
        content: "{{ github_app_private_key }}"
        dest: /home/hermes/.hermes/github_app.pem
        mode: "0600"
        owner: hermes
      become: true
      no_log: true

    - name: Authenticate gh as rafaelhdr-bot GitHub App
      ansible.builtin.shell: |
        header=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 | tr -d '=\n' | tr '/+' '_-')
        now=$(date +%s)
        payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now-60))" "$((now+600))" "{{ github_app_id }}" \
          | base64 | tr -d '=\n' | tr '/+' '_-')
        sig=$(printf '%s.%s' "$header" "$payload" \
          | openssl dgst -sha256 -sign /home/hermes/.hermes/github_app.pem | base64 | tr -d '=\n' | tr '/+' '_-')
        jwt="${header}.${payload}.${sig}"

        install_id=$(curl -sf \
          -H "Authorization: Bearer $jwt" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/app/installations \
          | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")

        token=$(curl -sf -X POST \
          -H "Authorization: Bearer $jwt" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/app/installations/${install_id}/access_tokens" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

        printf '%s' "$token" | gh auth login --with-token --hostname github.com
      become: true
      become_user: hermes
      environment:
        HOME: /home/hermes
      when: gh_auth_status.rc != 0
      no_log: true

    - name: Install mautrix encryption extras, db drivers, and web deps
      ansible.builtin.pip:
        name:
          - aiosqlite
          - asyncpg
          - fastapi
          - mautrix[encryption]
          - ptyprocess
          - uvicorn[standard]
        virtualenv: /home/hermes/.hermes/hermes-agent/venv
        state: present

    - name: Build dashboard web frontend
      ansible.builtin.shell:
        cmd: npm install && npm run build
        chdir: /home/hermes/.hermes/hermes-agent/web
      become: true
      become_user: hermes

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Hermes config
      ansible.builtin.template:
        src: templates/config.grocery.yaml.j2
        dest: "{{ app_dir }}/config.yaml"
        mode: "0644"
      notify: restart gateway

    - name: Deploy AGENTS.md
      ansible.builtin.copy:
        src: files/AGENTS.md
        dest: "{{ app_dir }}/AGENTS.md"
        mode: "0644"

    - name: Deploy root AGENTS.md
      ansible.builtin.copy:
        src: files/AGENTS.root.md
        dest: /home/hermes/.hermes/AGENTS.md
        mode: "0644"

    - name: Deploy SOUL.md
      ansible.builtin.copy:
        src: files/SOUL.md
        dest: "{{ app_dir }}/SOUL.md"
        mode: "0644"

    - name: Log in to Matrix for grocery gateway
      ansible.builtin.uri:
        url: "{{ matrix_homeserver }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "{{ matrix_user_id }}"
          password: "{{ matrix_password }}"
        status_code: 200
        return_content: true
      register: matrix_login_grocery
      when: matrix_password is defined and matrix_password | length > 0
      no_log: true
      ignore_errors: true

    - name: Set grocery access token and device id
      ansible.builtin.set_fact:
        _matrix_access_token_grocery: >-
          {{ matrix_login_grocery.json.access_token
             if (matrix_login_grocery is defined and matrix_login_grocery is not failed and matrix_login_grocery.json is defined and matrix_login_grocery.json.access_token is defined)
             else matrix_access_token | default('') }}
        _matrix_device_id_grocery: >-
          {{ matrix_login_grocery.json.device_id
             if (matrix_login_grocery is defined and matrix_login_grocery is not failed and matrix_login_grocery.json is defined and matrix_login_grocery.json.device_id is defined)
             else '' }}

    - name: Log in to Matrix for root gateway
      ansible.builtin.uri:
        url: "{{ matrix_homeserver }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "{{ matrix_user_id }}"
          password: "{{ matrix_password }}"
        status_code: 200
        return_content: true
      register: matrix_login_root
      when: matrix_password is defined and matrix_password | length > 0
      no_log: true
      ignore_errors: true

    - name: Set root access token and device id
      ansible.builtin.set_fact:
        _matrix_access_token_root: >-
          {{ matrix_login_root.json.access_token
             if (matrix_login_root is defined and matrix_login_root is not failed and matrix_login_root.json is defined and matrix_login_root.json.access_token is defined)
             else '' }}
        _matrix_device_id_root: >-
          {{ matrix_login_root.json.device_id
             if (matrix_login_root is defined and matrix_login_root is not failed and matrix_login_root.json is defined and matrix_login_root.json.device_id is defined)
             else '' }}

    - name: Remove Matrix store for clean session
      ansible.builtin.file:
        path: "{{ app_dir }}/platforms/matrix/store"
        state: absent

    - name: Deploy .env
      ansible.builtin.template:
        src: templates/.env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      notify: restart gateway

    - name: Deploy ~/.hermes/.env
      ansible.builtin.template:
        src: templates/hermes-home.env.j2
        dest: /home/hermes/.hermes/.env
        mode: "0600"
      notify:
        - restart dashboard
        - restart root gateway

    - name: Remove root Matrix store for clean session
      ansible.builtin.file:
        path: /home/hermes/.hermes/platforms/matrix/store
        state: absent

    - name: Deploy ~/.hermes/config.yaml
      ansible.builtin.template:
        src: templates/config.root.yaml.j2
        dest: /home/hermes/.hermes/config.yaml
        mode: "0644"
      notify:
        - restart dashboard
        - restart root gateway

    - name: Ensure ~/.hermes/cron directory exists
      ansible.builtin.file:
        path: /home/hermes/.hermes/cron
        state: directory
        owner: hermes
        mode: "0755"
      become: true

    - name: Deploy cron jobs
      ansible.builtin.template:
        src: templates/hermes-cron-jobs.json.j2
        dest: /home/hermes/.hermes/cron/jobs.json
        owner: hermes
        mode: "0644"
      become: true

    - name: Deploy systemd service
      ansible.builtin.template:
        src: templates/hermes-grocery-gateway.service.j2
        dest: /etc/systemd/system/hermes-grocery-gateway.service
        mode: "0644"
      become: true
      notify: restart gateway

    - name: Deploy hermes-root-gateway systemd service
      ansible.builtin.template:
        src: templates/hermes-root-gateway.service.j2
        dest: /etc/systemd/system/hermes-root-gateway.service
        mode: "0644"
      become: true
      notify: restart root gateway

    - name: Deploy hermes-dashboard systemd service
      ansible.builtin.template:
        src: templates/hermes-dashboard.service.j2
        dest: /etc/systemd/system/hermes-dashboard.service
        mode: "0644"
      become: true
      notify: restart dashboard

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: restart gateway

    - name: enable and start hermes-grocery-gateway
      ansible.builtin.systemd:
        name: hermes-grocery-gateway
        enabled: true
        state: restarted
      become: true
      listen: restart gateway

    - name: reload systemd for root gateway
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: restart root gateway

    - name: enable and start hermes-root-gateway
      ansible.builtin.systemd:
        name: hermes-root-gateway
        enabled: true
        state: restarted
      become: true
      listen: restart root gateway

    - name: reload systemd for dashboard
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: restart dashboard

    - name: enable and start hermes-dashboard
      ansible.builtin.systemd:
        name: hermes-dashboard
        enabled: true
        state: restarted
      become: true
      listen: restart dashboard
