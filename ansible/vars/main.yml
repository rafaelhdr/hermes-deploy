---
app_dir: /home/hermes/hermes-grocery
hermes_bin: /home/hermes/.hermes/hermes-agent/venv/bin/hermes
ssh_user: hermes

# Switch here to change the active LLM provider: 'minimax' or 'deepseek'
active_provider: minimax

providers:
  deepseek:
    default_model: deepseek-v4-flash
  minimax:
    default_model: MiniMax-M2.7

update_repos:
  - rafaelhdr/hermes-deploy
  - rafaelhdr/dotfiles
  - rafaelhdr/homelab

matrix_homeserver: https://matrix.org
matrix_encryption: "true"
matrix_e2ee_mode: "required"
matrix_home_room_thread_id: ""
matrix_home_room_thread_id_root: ""

hermes_timezone: Europe/Amsterdam
