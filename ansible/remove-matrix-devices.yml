---
- name: Prepare inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Read terraform outputs
      ansible.builtin.command: terraform output -json
      args:
        chdir: ../terraform
      register: tf_output
      changed_when: false

    - name: Add grocery host dynamically
      ansible.builtin.add_host:
        name: grocery
        ansible_host: "{{ zerotier_ip }}"
        ansible_user: "{{ tf_user }}"
        groups: hermes
      vars:
        tf_user: >-
          {{ (tf_output.stdout | from_json).ssh_connection.value
             | regex_replace('^ssh ([^@]+)@.*', '\1') }}

- name: Remove stale Matrix bot devices
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/secrets.yml

  tasks:
    - name: Log in to Matrix to obtain access token
      ansible.builtin.uri:
        url: "{{ matrix_homeserver }}/_matrix/client/v3/login"
        method: POST
        body_format: json
        body:
          type: m.login.password
          identifier:
            type: m.id.user
            user: "{{ matrix_user_id }}"
          password: "{{ matrix_password }}"
        status_code: 200
        return_content: true
      register: matrix_login
      no_log: true

    - name: List current devices
      ansible.builtin.uri:
        url: "{{ matrix_homeserver }}/_matrix/client/v3/devices"
        method: GET
        headers:
          Authorization: "Bearer {{ matrix_login.json.access_token }}"
        status_code: 200
        return_content: true
      register: matrix_devices

    - name: Show current devices
      ansible.builtin.debug:
        msg: "{{ matrix_devices.json.devices | map(attribute='device_id') | list }}"

    - name: Delete stale devices (all except the current session)
      ansible.builtin.uri:
        url: "{{ matrix_homeserver }}/_matrix/client/v3/devices/{{ item.device_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ matrix_login.json.access_token }}"
        body_format: json
        body:
          auth:
            type: m.login.password
            identifier:
              type: m.id.user
              user: "{{ matrix_user_id }}"
            password: "{{ matrix_password }}"
        status_code: [200, 404]
      loop: "{{ matrix_devices.json.devices }}"
      when: item.device_id != matrix_login.json.device_id
      no_log: true
      loop_control:
        label: "{{ item.device_id }}"

- name: Remove Matrix crypto stores on server
  hosts: hermes
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Remove grocery Matrix store
      ansible.builtin.file:
        path: "{{ app_dir }}/platforms/matrix/store"
        state: absent

    - name: Remove root Matrix store
      ansible.builtin.file:
        path: /home/hermes/.hermes/platforms/matrix/store
        state: absent
